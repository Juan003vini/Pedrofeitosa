<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Cotação 13x — Santos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;800;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    background: #050A05;
    color: #F0FFF4;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,106,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,106,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .orb {
    position: fixed;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,200,83,0.15) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: orbPulse 4s ease-in-out infinite;
  }
  .wrap {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,255,106,0.08);
    border: 1px solid rgba(0,255,106,0.3);
    border-radius: 100px;
    padding: 6px 18px;
    font-size: 12px;
    font-weight: 600;
    color: #00FF6A;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .badge-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00FF6A;
    animation: blink 1.2s infinite;
  }
  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 16vw, 130px);
    line-height: 0.9;
    letter-spacing: 0.02em;
  }
  .headline .green {
    color: #00FF6A;
    display: block;
    text-shadow: 0 0 60px rgba(0,255,106,0.5);
  }
  .odds-box {
    background: rgba(0,255,106,0.06);
    border: 1px solid rgba(0,255,106,0.2);
    border-radius: 12px;
    padding: 1.25rem 2.5rem;
  }
  .odds-label {
    font-size: 13px;
    font-weight: 600;
    color: #00FF6A;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .odds-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 14vw, 100px);
    color: #00FF6A;
    line-height: 1;
    text-shadow: 0 0 40px rgba(0,255,106,0.6);
  }
  .match {
    font-size: clamp(14px, 3.5vw, 20px);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.9;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #00FF6A;
    color: #050A05;
    font-family: 'Inter', sans-serif;
    font-size: clamp(15px, 4vw, 18px);
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 18px 48px;
    border-radius: 8px;
    text-decoration: none;
    animation: pulsebtn 2s infinite;
    transition: transform 0.15s;
  }
  .cta:hover { transform: scale(1.04); }
  .cta:active { transform: scale(0.97); }
  .trust {
    font-size: 12px;
    color: #5A7A5A;
    letter-spacing: 0.05em;
  }
  .trust span { color: #00FF6A; font-weight: 600; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  @keyframes orbPulse { 0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(1)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)} }
  @keyframes pulsebtn {
    0%,100%{ box-shadow: 0 0 0 0 rgba(0,255,106,0.5), 0 0 30px rgba(0,255,106,0.3); }
    50%{ box-shadow: 0 0 0 14px rgba(0,255,106,0), 0 0 50px rgba(0,255,106,0.5); }
  }
</style>
</head>
<body>
<div class="orb"></div>
<div class="wrap">
  <div class="badge"><span class="badge-dot"></span>Disponível agora</div>
  <h1 class="headline">
    Super<br>
    <span class="green">Cotação</span>
  </h1>
  <div class="odds-box">
    <div class="odds-label">Odd liberada</div>
    <div class="odds-value">13x</div>
  </div>
  <p class="match">Santos vencer a partida</p>
  <a href="https://go.aff.jogodeouro.bet.br/ztlfh52n?aposta=WDXG8BGWTEE" class="cta" target="_blank">
    Pegar agora →
  </a>
  <p class="trust">🔒 Acesso seguro &nbsp;·&nbsp; <span>Cotação por tempo limitado</span></p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Liberado</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    background: #050A05;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap {
    text-align: center;
    padding: 3rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    max-width: 400px;
    width: 100%;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,255,106,0.08);
    border: 1px solid rgba(0,255,106,0.2);
    border-radius: 100px;
    padding: 6px 18px;
    font-size: 12px;
    font-weight: 700;
    color: #00FF6A;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .badge-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00FF6A;
    animation: blink 1.2s infinite;
  }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(60px, 18vw, 120px);
    line-height: 0.9;
    color: #F0FFF4;
  }

  .headline .green {
    color: #00FF6A;
    display: block;
    text-shadow: 0 0 50px rgba(0,255,106,0.4);
  }

  .desc {
    font-size: 15px;
    color: #5A7A5A;
    line-height: 1.7;
  }

  .desc strong { color: #F0FFF4; }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #16a34a;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 18px 32px;
    border-radius: 8px;
    text-decoration: none;
    width: 100%;
    animation: pulsebtn 2s infinite;
    transition: transform 0.15s;
  }

  .cta:hover { transform: scale(1.03); }
  .cta:active { transform: scale(0.97); }

  .trust {
    font-size: 12px;
    color: #3A5A3A;
  }

  .trust span { color: #00FF6A; font-weight: 600; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes pulsebtn {
    0%,100%{ box-shadow: 0 0 0 0 rgba(22,163,74,0.5); }
    50%{ box-shadow: 0 0 0 14px rgba(22,163,74,0); }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="badge"><span class="badge-dot"></span>Disponível agora</div>

  <h1 class="headline">
    Acesso
    <span class="green">Liberado</span>
  </h1>

  <p class="desc"><strong>Acessa agora</strong> e garante<br>antes de encerrar.</p>

  <a href="https://go.aff.ginga.bet.br/kl4q9163?shareCode=RV7H5KA1T7U" class="cta" target="_blank">
    Acessar agora →
  </a>

  <p class="trust">🔒 Acesso seguro &nbsp;·&nbsp; <span>Por tempo limitado</span></p>

</div>
</body>
</html>
